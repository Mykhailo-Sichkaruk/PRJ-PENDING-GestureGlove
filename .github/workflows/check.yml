name: Build course documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop .#docs -c npm ci --prefix publishing/docusaurus
      - run: nix develop .#docs -c make build
      - uses: actions/upload-artifact@v4
        with:
          name: course-site
          path: publishing/docusaurus/build
